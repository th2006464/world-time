<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f7fb" />
  <meta name="description" content="六座城市的实时世界时间：北京、纽约、旧金山、伦敦、东京和悉尼。" />
  <title>世界时间 · World Time</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f7fb;
      --card: rgba(255, 255, 255, .9);
      --card-solid: #fff;
      --text: #162033;
      --muted: #738095;
      --line: #e2e8f0;
      --line-soft: #e7edf5;
      --blue: #1473e6;
      --blue-soft: #edf5ff;
      --shadow: 0 12px 34px rgba(31, 57, 90, .07);
      --shadow-hover: 0 18px 44px rgba(31, 57, 90, .12);
      --field-border: #d9e2ee;
      --field-bg: #fff;
      --btn-bg: #172033;
      --btn-text: #fff;
      --badge-bg: #edf5ff;
      --glow-opacity: .16;
      --dot-day: #e7a53a;
      --dot-night: #4a72c4;
      --threads-line: 31, 126, 235;
      --threads-opacity: .62;
    }
    html[data-theme="dark"] {
      color-scheme: dark;
      --bg: #090d14;
      --card: rgba(255, 255, 255, .045);
      --card-solid: rgba(255, 255, 255, .045);
      --text: #f2eee5;
      --muted: #8c94a3;
      --line: rgba(255, 255, 255, .12);
      --line-soft: rgba(255, 255, 255, .1);
      --blue: #6ea8f5;
      --blue-soft: rgba(110, 168, 245, .14);
      --shadow: none;
      --shadow-hover: 0 18px 44px rgba(0, 0, 0, .4);
      --field-border: rgba(255, 255, 255, .15);
      --field-bg: rgba(255, 255, 255, .05);
      --btn-bg: #f2eee5;
      --btn-text: #10151f;
      --badge-bg: rgba(110, 168, 245, .14);
      --glow-opacity: .25;
      --dot-day: #e7b657;
      --dot-night: #7898d7;
      --threads-line: 159, 184, 223;
      --threads-opacity: .4;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: var(--bg); }
    body {
      margin: 0; min-height: 100vh; color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Noto Sans SC", sans-serif;
      -webkit-font-smoothing: antialiased;
      background: radial-gradient(circle at 50% -10%, var(--bg-glow, #dbeaff), transparent 38%), var(--bg);
      overflow-x: hidden;
      transition: background .3s ease, color .3s ease;
    }
    html[data-theme="dark"] body {
      background:
        radial-gradient(circle at 78% 5%, #1e2e4a 0, transparent 35%),
        radial-gradient(circle at 8% 85%, #291d38 0, transparent 32%),
        #090d14;
    }
    html[data-theme="dark"] body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .32;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E");
    }
    .threads-bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: var(--threads-opacity); }
    main { position: relative; z-index: 1; width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 38px 0 calc(38px + env(safe-area-inset-bottom)); }
    .topbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 26px; }
    .eyebrow { display: block; margin: 0 0 10px; color: var(--blue); font-size: 10px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(28px, 4.4vw, 40px); line-height: 1.05; letter-spacing: -.04em; font-weight: 700; }
    .sub { margin: 8px 0 0; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .side { display: flex; align-items: center; gap: 14px; }
    .now { text-align: right; color: var(--muted); font: 400 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .1em; white-space: nowrap; text-transform: uppercase; }
    .now b { display: block; color: var(--text); font-size: 14px; font-weight: 500; letter-spacing: .04em; }
    .theme-toggle {
      display: grid; place-items: center; width: 46px; height: 46px; flex: 0 0 auto;
      border: 1px solid var(--field-border); border-radius: 14px; background: var(--card-solid);
      color: var(--text); cursor: pointer; box-shadow: var(--shadow); transition: .18s;
    }
    .theme-toggle:hover { border-color: var(--blue); box-shadow: 0 0 0 4px rgba(20, 115, 230, .12); }
    .theme-toggle svg { width: 20px; height: 20px; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .clock {
      min-height: 218px; padding: 24px 24px 20px; position: relative; overflow: hidden;
      background: var(--card); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 20px; box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease, border-color .25s ease;
    }
    .clock:hover { transform: translateY(-2px); box-shadow: var(--shadow-hover); z-index: 2; }
    .clock::after {
      content: ""; position: absolute; right: -48px; bottom: -65px; width: 150px; height: 150px; border-radius: 50%;
      background: var(--accent, var(--blue)); filter: blur(34px); opacity: var(--glow-opacity); pointer-events: none;
    }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .city { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -.02em; }
    .code {
      padding: 5px 9px; border-radius: 99px; background: var(--badge-bg); color: var(--blue);
      font: 700 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em;
    }
    .time { margin: 34px 0 10px; font: 300 clamp(34px, 4.3vw, 54px)/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
    .seconds { color: var(--muted); font-size: .48em; letter-spacing: -.03em; }
    .meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font: 400 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent, var(--blue)); box-shadow: 0 0 10px var(--accent, var(--blue)); }
    .hq {
      position: absolute; top: 22px; right: 24px; padding: 5px 9px; border-radius: 99px;
      background: var(--blue-soft); color: var(--blue); font-size: 9px; font-weight: 800; letter-spacing: .13em; text-transform: uppercase;
    }
    footer { display: flex; justify-content: space-between; gap: 20px; margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line-soft); color: var(--muted); font: 400 10px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 820px) { .grid { grid-template-columns: repeat(2, 1fr); } .time { font-size: clamp(34px, 6.6vw, 50px); } }
    @media (max-width: 600px) {
      main { width: calc(100% - 24px); padding-top: 26px; }
      .topbar { align-items: flex-start; margin-bottom: 20px; }
      .now { display: none; }
      .grid { grid-template-columns: 1fr; }
      .clock { min-height: 190px; }
      .time { margin-top: 26px; }
      footer { flex-direction: column; gap: 6px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } .threads-bg { opacity: .3; } }
  </style>
</head>
<body>
  <canvas class="threads-bg" aria-hidden="true"></canvas>
  <main>
    <header class="topbar">
      <div class="brand">
        <p class="eyebrow">Six cities · One moment</p>
        <h1>世界时间</h1>
        <p class="sub">六座城市的实时时刻，随夏令时自动切换时区</p>
      </div>
      <div class="side">
        <div class="now"><span>Local moment</span><b id="localTime">—</b></div>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M19.1 4.9l-1.6 1.6M6.5 17.5l-1.6 1.6"/></svg>
        </button>
      </div>
    </header>
    <section class="grid" id="clocks" aria-label="全球城市时间"></section>
    <footer><span>Live · Updates every second</span><span>Time zones shift automatically with daylight saving</span></footer>
  </main>
  <script>
    const THEME_KEY = "wt-theme";
    const root = document.documentElement;
    const themeMeta = document.querySelector('meta[name="theme-color"]');
    const saved = localStorage.getItem(THEME_KEY);
    const initial = saved === "light" || saved === "dark" ? saved : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    root.dataset.theme = initial;
    themeMeta.content = initial === "dark" ? "#090d14" : "#f4f7fb";
    document.querySelector("#themeToggle").addEventListener("click", () => {
      const next = root.dataset.theme === "dark" ? "light" : "dark";
      root.dataset.theme = next;
      themeMeta.content = next === "dark" ? "#090d14" : "#f4f7fb";
      localStorage.setItem(THEME_KEY, next);
      window.dispatchEvent(new Event("wt-themechange"));
    });

    const cities = [
      { city: "北京", code: "PEK", zone: "Asia/Shanghai", glow: "#db6a46" },
      { city: "旧金山", code: "SFO", zone: "America/Los_Angeles", glow: "#b687db", hq: true },
      { city: "纽约", code: "NYC", zone: "America/New_York", glow: "#5f92dd" },
      { city: "伦敦", code: "LON", zone: "Europe/London", glow: "#70b8a2" },
      { city: "东京", code: "TYO", zone: "Asia/Tokyo", glow: "#d47d9d" },
      { city: "悉尼", code: "SYD", zone: "Australia/Sydney", glow: "#d0a458" }
    ];
    const container = document.querySelector("#clocks");
    const timeParts = (date, zone) => Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: zone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(date).filter(p => p.type !== "literal").map(p => [p.type, p.value]));
    const offsetFor = (date, zone) => {
      const value = new Intl.DateTimeFormat("en-US", { timeZone: zone, timeZoneName: "longOffset" }).formatToParts(date).find(p => p.type === "timeZoneName")?.value || "GMT";
      return value.replace("GMT", "UTC").replace(":00", "");
    };
    cities.forEach((item, index) => {
      const article = document.createElement("article");
      article.className = "clock"; article.style.setProperty("--glow", item.glow); article.dataset.index = index;
      article.innerHTML = `<div class="topline"><h2 class="city">${item.city}</h2><span class="code">${item.code}</span></div>${item.hq ? '<span class="hq">ChatGPT HQ</span>' : ''}<div class="time"><span data-time>00:00</span><span class="seconds" data-seconds>:00</span></div><div class="meta"><span data-date>—</span><span class="status"><i class="dot"></i><span data-status>—</span></span></div>`;
      container.appendChild(article);
    });
    function update() {
      const now = new Date();
      cities.forEach((item, index) => {
        const el = container.children[index], parts = timeParts(now, item.zone), hour = Number(parts.hour) % 24, isDay = hour >= 7 && hour < 19;
        el.style.setProperty("--accent", isDay ? "var(--dot-day)" : "var(--dot-night)");
        el.querySelector("[data-time]").textContent = `${parts.hour}:${parts.minute}`;
        el.querySelector("[data-seconds]").textContent = `:${parts.second}`;
        el.querySelector("[data-date]").textContent = new Intl.DateTimeFormat("zh-CN", { timeZone: item.zone, month: "short", day: "numeric", weekday: "short" }).format(now) + " · " + offsetFor(now, item.zone);
        el.querySelector("[data-status]").textContent = isDay ? "DAYLIGHT" : "NIGHT";
      });
      document.querySelector("#localTime").textContent = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(now);
    }
    update(); setInterval(update, 1000);

    (function initThreads() {
      const canvas = document.querySelector(".threads-bg");
      const context = canvas.getContext("2d", { alpha: true });
      const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
      let width = 0, height = 0, ratio = 1, frame = 0, lineRGB = "31, 126, 235";
      let mouse = { x: .5, y: .5 };
      let target = { x: .5, y: .5 };
      function syncLineColor() {
        lineRGB = (getComputedStyle(root).getPropertyValue("--threads-line") || "").trim() || "31, 126, 235";
      }
      window.addEventListener("wt-themechange", syncLineColor);
      syncLineColor();
      function resize() {
        ratio = Math.min(devicePixelRatio || 1, 1.5); width = innerWidth; height = innerHeight;
        canvas.width = Math.round(width * ratio); canvas.height = Math.round(height * ratio);
        canvas.style.width = `${width}px`; canvas.style.height = `${height}px`;
        context.setTransform(ratio, 0, 0, ratio, 0, 0);
      }
      function draw(time = 0) {
        context.clearRect(0, 0, width, height);
        mouse.x += (target.x - mouse.x) * .035;
        mouse.y += (target.y - mouse.y) * .035;
        const phase = time * .00016;
        const amplitude = Math.min(height * .13, 135) * (1 + (mouse.y - .5) * .18);
        const base = height * .28;
        context.lineCap = "round";
        for (let line = 0; line < 30; line += 1) {
          const progress = line / 29; context.beginPath();
          for (let x = -20; x <= width + 20; x += 12) {
            const nx = x / Math.max(width, 1);
            const fade = Math.pow(Math.max(0, nx), .72);
            const wave = Math.sin(nx * 7.2 + phase * 6 + progress * 4.6) + .46 * Math.sin(nx * 15.5 - phase * 3 + progress * 8.1);
            const y = base + progress * height * .42 + wave * amplitude * fade * .24 + (mouse.x - .5) * 32 * fade;
            x === -20 ? context.moveTo(x, y) : context.lineTo(x, y);
          }
          context.strokeStyle = `rgba(${lineRGB},${.015 + (1 - progress) * .05})`;
          context.lineWidth = .7 + (1 - progress) * .7; context.stroke();
        }
        if (!reduced && !document.hidden) frame = requestAnimationFrame(draw);
      }
      addEventListener("resize", () => { resize(); draw(); }, { passive: true });
      addEventListener("pointermove", (event) => {
        target.x = event.clientX / Math.max(innerWidth, 1);
        target.y = 1 - event.clientY / Math.max(innerHeight, 1);
      }, { passive: true });
      resize(); draw();
      document.addEventListener("visibilitychange", () => {
        cancelAnimationFrame(frame);
        if (!document.hidden && !reduced) frame = requestAnimationFrame(draw);
      });
    })();
  </script>
</body>
</html>
