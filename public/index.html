<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c111b" />
  <meta name="description" content="六座城市的实时世界时间：北京、纽约、旧金山、伦敦、东京和悉尼。" />
  <title>世界时间 · World Time</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+SC:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root { color-scheme: dark; --ink: #f2eee5; --muted: #8c94a3; --line: rgba(255,255,255,.12); --panel: rgba(255,255,255,.045); }
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #090d14; }
    body { margin: 0; min-height: 100vh; color: var(--ink); font-family: "Noto Sans SC", sans-serif; background: radial-gradient(circle at 78% 5%, #1e2e4a 0, transparent 35%), radial-gradient(circle at 8% 85%, #291d38 0, transparent 32%), #090d14; overflow-x: hidden; }
    body::before { content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .32; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.08'/%3E%3C/svg%3E"); }
    main { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding: 72px 0 48px; position: relative; }
    header { display: flex; justify-content: space-between; align-items: flex-end; gap: 24px; margin-bottom: 44px; }
    .eyebrow { margin: 0 0 13px; color: #9fb8df; font: 500 11px/1 "DM Mono", monospace; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(42px, 7vw, 86px); line-height: .94; letter-spacing: -.065em; font-weight: 500; }
    h1 span { color: #677182; font-weight: 300; }
    .now { text-align: right; color: var(--muted); font: 400 12px/1.7 "DM Mono", monospace; letter-spacing: .08em; white-space: nowrap; }
    .now b { display: block; color: var(--ink); font-size: 14px; font-weight: 400; }
    .grid { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
    .clock { min-height: 255px; padding: 26px 26px 22px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(12px); position: relative; overflow: hidden; transition: background .25s ease, transform .25s ease; }
    .clock:hover { background: rgba(255,255,255,.075); z-index: 2; transform: translateY(-2px); }
    .clock::after { content: ""; position: absolute; right: -48px; bottom: -65px; width: 150px; height: 150px; border-radius: 50%; background: var(--glow); filter: blur(30px); opacity: .25; }
    .topline { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .city { margin: 0; font-size: 20px; font-weight: 500; letter-spacing: -.03em; }
    .code { color: var(--muted); font: 400 11px/1 "DM Mono", monospace; letter-spacing: .16em; }
    .time { margin: 40px 0 7px; font: 300 clamp(35px, 4.3vw, 56px)/1 "DM Mono", monospace; letter-spacing: -.07em; font-variant-numeric: tabular-nums; }
    .seconds { color: var(--muted); font-size: .48em; letter-spacing: -.04em; }
    .meta { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font: 400 11px/1.5 "DM Mono", monospace; }
    .status { display: inline-flex; align-items: center; gap: 7px; }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
    .hq { position: absolute; top: 60px; right: 26px; padding: 5px 8px; border: 1px solid rgba(255,255,255,.15); border-radius: 999px; color: #b8c9e4; font-size: 9px; letter-spacing: .13em; text-transform: uppercase; }
    footer { display: flex; justify-content: space-between; gap: 20px; padding-top: 22px; color: #656e7c; font: 400 10px/1.5 "DM Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    @media (max-width: 820px) { main { padding-top: 48px; } .grid { grid-template-columns: repeat(2,1fr); } .time { font-size: clamp(36px, 7vw, 52px); } }
    @media (max-width: 560px) { main { width: min(100% - 24px, 420px); padding-top: 32px; } header { align-items: flex-start; margin-bottom: 30px; } .now { display: none; } h1 { font-size: 50px; } .grid { grid-template-columns: 1fr; } .clock { min-height: 218px; } .time { margin-top: 30px; font-size: 48px; } footer { flex-direction: column; } }
    @media (prefers-reduced-motion: reduce) { .clock { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Six cities · One moment</p><h1>世界时间<span>。</span></h1></div>
      <div class="now"><span>YOUR LOCAL MOMENT</span><b id="localTime">—</b></div>
    </header>
    <section class="grid" id="clocks" aria-label="全球城市时间"></section>
    <footer><span>Live · Updates every second</span><span>Time zones shift automatically with daylight saving</span></footer>
  </main>
  <script>
    const cities = [
      { city: "北京", code: "PEK", zone: "Asia/Shanghai", glow: "#db6a46" },
      { city: "纽约", code: "NYC", zone: "America/New_York", glow: "#5f92dd" },
      { city: "旧金山", code: "SFO", zone: "America/Los_Angeles", glow: "#b687db", hq: true },
      { city: "伦敦", code: "LON", zone: "Europe/London", glow: "#70b8a2" },
      { city: "东京", code: "TYO", zone: "Asia/Tokyo", glow: "#d47d9d" },
      { city: "悉尼", code: "SYD", zone: "Australia/Sydney", glow: "#d0a458" }
    ];
    const container = document.querySelector("#clocks");
    const timeParts = (date, zone) => Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: zone, hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).formatToParts(date).filter(p => p.type !== "literal").map(p => [p.type, p.value]));
    const offsetFor = (date, zone) => {
      const value = new Intl.DateTimeFormat("en-US", { timeZone: zone, timeZoneName: "longOffset" }).formatToParts(date).find(p => p.type === "timeZoneName")?.value || "GMT";
      return value.replace("GMT", "UTC").replace(":00", "");
    };
    cities.forEach((item, index) => {
      const article = document.createElement("article");
      article.className = "clock"; article.style.setProperty("--glow", item.glow); article.dataset.index = index;
      article.innerHTML = `<div class="topline"><h2 class="city">${item.city}</h2><span class="code">${item.code}</span></div>${item.hq ? '<span class="hq">ChatGPT HQ</span>' : ''}<div class="time"><span data-time>00:00</span><span class="seconds" data-seconds>:00</span></div><div class="meta"><span data-date>—</span><span class="status"><i class="dot"></i><span data-status>—</span></span></div>`;
      container.appendChild(article);
    });
    function update() {
      const now = new Date();
      cities.forEach((item, index) => {
        const el = container.children[index], parts = timeParts(now, item.zone), hour = Number(parts.hour) % 24, isDay = hour >= 7 && hour < 19;
        el.style.setProperty("--accent", isDay ? "#e7b657" : "#7898d7");
        el.querySelector("[data-time]").textContent = `${parts.hour}:${parts.minute}`;
        el.querySelector("[data-seconds]").textContent = `:${parts.second}`;
        el.querySelector("[data-date]").textContent = new Intl.DateTimeFormat("zh-CN", { timeZone: item.zone, month: "short", day: "numeric", weekday: "short" }).format(now) + " · " + offsetFor(now, item.zone);
        el.querySelector("[data-status]").textContent = isDay ? "DAYLIGHT" : "NIGHT";
      });
      document.querySelector("#localTime").textContent = new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit", hour12: false }).format(now);
    }
    update(); setInterval(update, 1000);
  </script>
</body>
</html>
